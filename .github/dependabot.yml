# Dependabot here is security-only. Every ecosystem sets open-pull-requests-limit: 0, which turns off
# routine version-update pull requests (they spent CI minutes on churn and were not the way dependencies get
# raised here: versions move on purpose, with the migration or test that goes with them). Security updates
# are a separate Dependabot feature with their own limit, so a vulnerable dependency still gets a pull
# request. The ignore entries below are kept as the record of why a major is held back; `schedule` stays
# because the file format requires it.
version: 2
updates:
  # The .NET server. Versions are pinned centrally in apps/server/Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /apps/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # apps/web is the shipped frontend. CI's `npm audit --audit-level=high` only fails a build
  # after the fact and ignores moderate severities; Dependabot security updates open the PRs that fix them.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Keep unsupported toolchain majors quiet until their peer ecosystem catches up.
    # Checked 2026-09-27: eslint-plugin-jsx-a11y 6.10.2 (latest) still declares
    # peerDependencies eslint "^3 || ... || ^9" and rejects ESLint 10.11.0 (latest);
    # see jsx-eslint/eslint-plugin-jsx-a11y#1075. openapi-typescript 7.13.0 (latest)
    # still declares peerDependencies typescript "^5.x" and has no TypeScript 6/7
    # support yet; see openapi-ts/openapi-typescript#2723 (TS6) and #2841 (TS7).
    # Dependabot will resume these automatically when the bounds below are
    # deliberately revised with the corresponding migration.
    ignore:
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0"
      - dependency-name: "@eslint/js"
        versions:
          - ">=10.0.0"
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"

  # The browser driver of the weir-browser scenario shard; test tooling, kept in step by hand.
  - package-ecosystem: npm
    directory: /scripts/scenarios-ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Checked 2026-09-27: @docusaurus/tsconfig (from Docusaurus 3.10.2, latest;
    # no newer major is out) still sets "baseUrl": "." in its published tsconfig,
    # which TypeScript 7.0.2 rejects outright (error TS5102, "Option 'baseUrl'
    # has been removed"); see facebook/docusaurus#11893. Lift this once Docusaurus
    # drops baseUrl from that config.
    ignore:
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"

  # The tray, which ships in the Windows installer. Its pins are in apps/tray/Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /apps/tray
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # The Dockerfile's base images, pinned by digest with the tag kept as a comment for context.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # The web build stage's node major must match the root .node-version (scripts/check-node-docker-
    # version.mjs enforces it); #788 bumped the Dockerfile alone and briefly split it from CI's node
    # major. This keeps patch and digest updates within 24 flowing while holding a major bump until
    # .node-version, the Dockerfile and every setup-node step are raised together on purpose.
    ignore:
      - dependency-name: "node"
        versions:
          - ">=25"
