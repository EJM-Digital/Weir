# Mutation testing of the code that can lose a person's film or lock them out (#977, docs/coverage/mutation.md).
# Line coverage says a line ran; a mutation run changes the code (flips a condition, drops a statement, swaps an
# operator) and checks that some test fails. A change no test notices is a survivor, and each survivor is a test that
# is missing.
#
# One matrix job per target (the targets are in .github/mutation-targets.json), each running Stryker.NET (the server and
# the tray) or StrykerJS (the web app) over only the files the target names, then one job that holds each score to its floor
# in docs/coverage/mutation-floors.json and lists the survivors on its summary page.
#
# A target takes tens of minutes to hours on a Windows runner, so this workflow never runs on a pull request (a rule
# scripts/check-workflow-hygiene.mjs holds). It runs every target weekly, and by hand for the targets asked for: the release
# asks, for each target, for a passing run on the tagged commit or an earlier one where that target's own files, tests and
# setup are unchanged (scripts/verify-heavy-ci-for-release.mjs, docs/ci-cost.md), so a release runs only the targets that
# changed. By hand, `gh workflow run mutation.yml --ref <ref> -f targets=<ids>` runs the listed targets (ids are in
# .github/mutation-targets.json), and `-f targets=changed:<sha>` runs the ones whose files, tests or setup differ from <sha>.
# The floors of the targets that ran are checked whenever it runs.
name: Mutation

on:
  schedule:
  # Sundays, 11:17 UTC (Sunday 22:17 Sydney, AEDT). Off the top of the hour. GitHub may start a scheduled run late on busy days.
    - cron: "17 11 * * 0"
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets to mutate: all, a comma-separated list of ids (see .github/mutation-targets.json), or changed:<sha> for the targets whose files, tests or setup differ from that commit"
        required: false
        default: all
        type: string

# A run that has started is never cancelled: it is the proof a release is waiting for.
concurrency:
  group: mutation-${{ github.ref }}-${{ inputs.targets }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # The targets to run: all of them on the weekly run, else the ones asked for.
  select:
    name: Select the targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      targets: ${{ steps.select.outputs.targets }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - id: select
        env:
          REQUESTED: ${{ inputs.targets }}
        run: node scripts/resolve-mutation-targets.mjs

  mutate:
    name: Mutate ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 200
    needs: select
    if: needs.select.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.kind == 'dotnet'
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/*/**/packages.lock.json

      # Restored from the solution's own folder, so its global.json picks the pinned SDK the lock files were made with.
      - name: Restore (locked) and the pinned Stryker.NET
        if: matrix.kind == 'dotnet'
        working-directory: ${{ matrix.restore }}
        shell: bash
        run: |
          dotnet restore "${{ matrix.solution }}" --locked-mode
          dotnet tool restore

      # The real-tool tests skip themselves here: a mutation run needs the tests that judge the code, and the ones that
      # need ffmpeg or mkvmerge judge the media layer, not these targets. Stryker runs the test project in its own folder
      # (each config path is from that folder), 4 mutants at a time.
      - name: Mutate with Stryker.NET
        if: matrix.kind == 'dotnet'
        timeout-minutes: 180
        working-directory: ${{ matrix.directory }}
        shell: bash
        run: dotnet stryker -f "${{ matrix.config }}" -O "$GITHUB_WORKSPACE/mutation-output" --skip-version-check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: matrix.kind == 'web'
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the web app
        if: matrix.kind == 'web'
        timeout-minutes: 10
        working-directory: apps/web
        run: npm ci

      - name: Mutate with StrykerJS
        if: matrix.kind == 'web'
        timeout-minutes: 180
        working-directory: apps/web
        shell: bash
        run: |
          npx stryker run mutation/${{ matrix.target }}/stryker.config.json

      - name: Gather the report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p mutation-report
          if [ "${{ matrix.kind }}" = dotnet ]; then
            cp mutation-output/reports/mutation-report.json mutation-output/reports/mutation-report.html mutation-report/ || true
          else
            cp apps/web/reports/mutation/${{ matrix.target }}/mutation-report.json apps/web/reports/mutation/${{ matrix.target }}/mutation-report.html mutation-report/ || true
          fi

      - name: Upload the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: mutation-report

  # Every target's score against its floor; the survivors on the summary page and in an artifact.
  check:
    needs: [select, mutate]
    if: ${{ !cancelled() && needs.select.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download every target's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-*
          path: mutation-reports

      # Only the targets that ran have a report; the others are not judged by this run.
      - name: Mutation scores against the floors
        env:
          TARGETS: ${{ needs.select.outputs.targets }}
        run: node scripts/check-mutation-floors.mjs --floors docs/coverage/mutation-floors.json --reports mutation-reports --only "$TARGETS" --out mutation-survivors

      - name: Upload the survivors
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-survivors
          if-no-files-found: ignore
          retention-days: 90
          path: mutation-survivors
