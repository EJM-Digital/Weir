# The Docker and Windows package smokes, called by ci.yml when packaging, app or workflow files change. Each builds
# the shippable artefact from this commit and exercises it; neither publishes anything. The Windows one also keeps
# its Setup and portable package for a week as a workflow artifact, so any commit CI built can be installed.
name: Package smokes

on:
  workflow_call:
    inputs:
      arm64:
        description: Also build the linux/arm64 image (slow under QEMU).
        type: boolean
        required: true
      version:
        description: The release a golden-path build is meant to become; empty for the placeholder version.
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
      WEIR_LIVE_E2E_FIXTURE_HOST_ROOT: ${{ github.workspace }}/artifacts/docker-ci-fixture
      WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT: /e2e-fixture
      WEIR_LIVE_E2E_FFMPEG: ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The compose smokes read SQLite files with node:sqlite, which the runner's default Node may not have.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/server/Directory.Packages.props') }}

      # The live audit generates its media fixtures with the host's ffmpeg.
      - uses: ./.github/actions/setup-ffmpeg-linux
        timeout-minutes: 10

      - uses: ./.github/actions/apt-fail-fast

      # The live audit (apps/server/tools/Weir.LiveAudit) is built here so the browser install can use the
      # script the build generates for its Playwright version, and the audit step does not compile mid-run.
      # The browser's system libraries come from apt, told to retry and give up on a dead mirror.
      - name: Build the live audit and install its browser
        timeout-minutes: 15
        run: |
          dotnet restore apps/server/tools/Weir.LiveAudit --locked-mode
          dotnet build apps/server/tools/Weir.LiveAudit -c Release --no-restore
          pwsh apps/server/tools/Weir.LiveAudit/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Weir Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: weir-ci-smoke
          cache-from: type=gha,scope=weir-ci-amd64
          cache-to: type=gha,mode=max,scope=weir-ci-amd64,ignore-error=true

      # The same gate the release applies, run here so a fixable HIGH/CRITICAL in the image stops a pull
      # request instead of a tagged release.
      - name: Trivy scan of the Docker candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: weir-ci-smoke
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start Weir Docker candidate
        run: |
          docker rm -f weir-ci-smoke >/dev/null 2>&1 || true
          mkdir -p "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          chmod 0777 "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT"
          docker run -d --name weir-ci-smoke -p 9347:9347 \
            -v "$WEIR_LIVE_E2E_FIXTURE_HOST_ROOT:$WEIR_LIVE_E2E_FIXTURE_SERVER_ROOT" \
            -e WEIR_SESSION_SECRET="$WEIR_SESSION_SECRET" \
            -e WEIR_SESSION_COOKIE_SECURE=false \
            weir-ci-smoke
          node scripts/wait-for-health.mjs --container weir-ci-smoke

      # #548: the writer setting's "best" default degrades to ffmpeg without complaint when mkvmerge is
      # missing, so an image that quietly stopped installing it would pass every other step here. This
      # asserts the binary is in the image and runs at all; the live E2E below reads
      # /api/v1/system/media-tools, which proves the endpoint answers in a real deployment.
      - name: Docker candidate carries mkvmerge
        run: |
          version="$(docker exec weir-ci-smoke mkvmerge --version | head -n 1)"
          case "$version" in
            mkvmerge\ *) echo "Docker image carries $version" ;;
            *) echo "The Docker image did not report a usable mkvmerge: $version" >&2; exit 1 ;;
          esac

      - name: Full live E2E against Docker candidate
        env:
          WEIR_LIVE_BASE_URL: http://127.0.0.1:9347
          WEIR_LIVE_E2E_ARTIFACTS: artifacts/docker-ci-e2e
          # The container sees the audit's browser as the Docker bridge gateway, not loopback, so
          # bootstrap needs the one-time setup code; the audit reads it from this container's own log.
          WEIR_LIVE_E2E_DOCKER_CONTAINER: weir-ci-smoke
        run: dotnet apps/server/tools/Weir.LiveAudit/bin/Release/net10.0/Weir.LiveAudit.dll

      - name: Upload Docker live-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-docker-live-audit
          if-no-files-found: warn
          path: artifacts/docker-ci-e2e/*

      - name: Cleanup Weir Docker smoke
        if: always()
        run: docker rm -f weir-ci-smoke >/dev/null 2>&1 || true

      # The file people copy, run as it ships (compose.yaml: its cap_drop, its capabilities, the UID/GID entrypoint) on its named volume.
      # It publishes the same port as the container above, so it runs after that one is gone. See docs/install-docker.md.
      - name: Compose restart keeps the data
        if: ${{ !cancelled() }}
        run: node scripts/docker-compose-smoke.mjs restart --candidate weir-ci-smoke

      # The previous published release's image on a volume, then this build on the same volume; a release with a predecessor whose
      # image cannot be pulled fails here rather than skipping.
      - name: Compose upgrade from the previous release keeps the data
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASING: ${{ inputs.version }}
        run: node scripts/docker-compose-smoke.mjs upgrade --candidate weir-ci-smoke --releasing "$RELEASING"

      # The entrypoint as root: the user mapping, the secrets, who owns the data folder and what a delivered file ends up as (docker/README.md,
      # "File ownership"), with compose.yaml's own capabilities and a media folder bind-mounted from this runner.
      - name: Compose entrypoint maps the user, keeps the secrets and owns the folders
        if: ${{ !cancelled() }}
        run: node scripts/docker-compose-smoke.mjs entrypoint --candidate weir-ci-smoke

      # A person locked out of Weir runs the recovery command the Docker page gives them; this runs it the same way in the running container.
      - name: Compose recover resets a forgotten password
        if: ${{ !cancelled() }}
        run: node scripts/docker-compose-smoke.mjs recover --candidate weir-ci-smoke

      - name: Upload Docker compose smoke logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-docker-compose-smoke
          if-no-files-found: warn
          path: artifacts/docker-compose-smoke/**

  # Weir's scenario suite on GitHub's own runners, replacing the Hyper-V VM (docs/exec-plans/active/PLAN-SCENARIOS-IN-CI.md). One job per
  # shard, each with a Compose stack of its own, against the image built from this commit with its real ffmpeg. The shards listed here
  # are those with a scenario ported (scripts/scenarios-ci/homes.json); the VM stays the release gate until each scenario has passed twice here.
  scenarios-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [weir-only, weir-browser, with-deluno]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The scenarios read SQLite files with node:sqlite, which the runner's default Node may not have.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The same image and cache as the Docker smoke above: the build is a cache hit when both run on one commit.
      - name: Build Weir Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: weir-ci-smoke
          cache-from: type=gha,scope=weir-ci-amd64
          cache-to: type=gha,mode=max,scope=weir-ci-amd64,ignore-error=true

      # Only the shard that drives a browser needs one: the driver is pinned and locked in scripts/scenarios-ci, and Chromium is the one it was built for.
      - name: Install the browser
        if: ${{ matrix.shard == 'weir-browser' }}
        working-directory: scripts/scenarios-ci
        run: |
          npm ci
          npx playwright-core install --with-deps chromium

      - name: Run the shard's scenarios against the image
        run: node scripts/scenarios-in-ci.mjs "$SHARD" --candidate weir-ci-smoke

      - name: Upload scenario logs and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-scenarios-${{ matrix.shard }}
          if-no-files-found: warn
          path: artifacts/scenarios-in-ci/**

  # The arm64 image the release publishes, started under QEMU on an x86-64 runner (PLAT-13). The server is cross-published natively in the
  # SDK stage; the final stage's apt-get and everything that runs afterwards are emulated, which is why this is its own job: it overlaps the
  # amd64 smokes instead of following them.
  docker-arm64-smoke:
    if: inputs.arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The smoke script reads SQLite files with node:sqlite, which the runner's default Node may not have.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Weir Docker image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: weir-ci-smoke:arm64
          cache-from: type=gha,scope=weir-ci-arm64
          cache-to: type=gha,mode=max,scope=weir-ci-arm64,ignore-error=true

      - name: Start the arm64 image under QEMU
        run: node scripts/docker-compose-smoke.mjs arm64 --candidate weir-ci-smoke:arm64

      - name: Upload arm64 smoke logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-docker-arm64-smoke
          if-no-files-found: warn
          path: artifacts/docker-compose-smoke/**

  windows-package-smoke:
    # Always GitHub's own runner: this job installs Weir for real, which needs a clean machine every time.
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      # The version the Setup this job builds must report: the release a golden-path build is meant to become, with the commit, or empty
      # for the placeholder build, which reports the version the server project declares.
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: |
            apps/server/**/packages.lock.json
            apps/tray/**/packages.lock.json

      # The vendor folder is gitignored, so without a cache every run downloads FFmpeg and MKVToolNix again.
      # Both are pinned in packaging/windows/build-velopack-vendored-media-tools.ps1 (dot-sourced from
      # build-velopack.ps1): FFmpeg's key reads that pin's own values (tag, archive, SHA256),
      # MKVToolNix's key hashes the whole file. Either way the build script re-checks the vendored copy.
      - name: FFmpeg build checksum
        id: ffmpeg
        shell: bash
        run: node scripts/ffmpeg-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: Cache vendored FFmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/ffmpeg
          key: ${{ runner.os }}-${{ steps.ffmpeg.outputs.key }}

      - name: Cache vendored MKVToolNix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/windows/vendor/mkvtoolnix
          key: mkvtoolnix-vendor-${{ runner.os }}-${{ hashFiles('packaging/windows/build-velopack-vendored-media-tools.ps1') }}
          restore-keys: |
            mkvtoolnix-vendor-${{ runner.os }}-

      # The installable build of this exact commit, for the golden path (docs/release.md, "Golden path before
      # tagging"): the setup and portable packages the release would ship, but built without a tag and never
      # published. Named by the commit, kept a week. It carries the placeholder version 0.0.1-dev, or, on a manual
      # run given a version, that version with the commit as build metadata (1.0.0-rc.4+abc1234), so Weir and
      # Deluno both name the exact build. A pull request run is not offered: it built the branch merged into main,
      # not a commit anyone can tag.
      - name: Name the build by its commit
        id: build
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          short="${GITHUB_SHA:0:7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_VERSION" ]; then
            if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+.[0-9]+.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "The version '$RELEASE_VERSION' is not a release version such as 1.0.0 or 1.0.0-rc.4." >&2
              exit 1
            fi
            echo "WEIR_BUILD_VERSION=$RELEASE_VERSION+$short" >> "$GITHUB_ENV"
            echo "version=$RELEASE_VERSION+$short" >> "$GITHUB_OUTPUT"
          fi

      # Builds the web app, publishes the .NET server and the tray, vendors FFmpeg and MKVToolNix, installs the
      # pinned vpk CLI and packs.
      - name: Build Weir Windows package (Velopack)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build-velopack.ps1

      - name: Smoke test packaged Windows server
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-package.ps1

      # The recovery command a locked-out person runs where Weir is installed, from the packaged server folder: the password is reset,
      # the forgotten one is refused, the new one signs in, and what the command printed is kept.
      - name: Recover a locked-out account with the packaged WeirServer.exe
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows-recover.ps1

      - name: Upload what the recover command printed
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-windows-recover-smoke
          if-no-files-found: warn
          path: artifacts/windows-recover-smoke/**

      # The Setup the Windows scenarios install, in every run (a pull request's too), for a day: the next job takes it from here.
      - name: Keep the Setup for the Windows scenarios
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-windows-setup-under-test
          if-no-files-found: error
          retention-days: 1
          path: dist/windows/releases/Weir-win-Setup.exe

      - name: Upload the Windows build of this commit
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-windows-${{ steps.build.outputs.short }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/windows/releases/Weir-win-Setup.exe
            dist/windows/releases/Weir-win-Portable.zip

  # Weir's Windows scenarios on a clean GitHub-hosted runner, replacing the Hyper-V VM (docs/exec-plans/active/PLAN-SCENARIOS-IN-CI.md): the
  # Setup the job above built is installed for real, used, and uninstalled. The shards listed here are those with a scenario ported
  # (scripts/scenarios-ci/homes.json). Always GitHub's own runner: the shard refuses to run on a machine that is not one, because it installs
  # and uninstalls Weir.
  scenarios-windows:
    needs: windows-package-smoke
    runs-on: windows-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        shard: [windows-install, windows-files]
    env:
      SHARD: ${{ matrix.shard }}
      BUILD_VERSION: ${{ needs.windows-package-smoke.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Fetch the Setup under test
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weir-windows-setup-under-test
          path: setup

      - name: Run the shard's scenarios against the Setup
        shell: bash
        run: node scripts/scenarios-in-ci.mjs "$SHARD" --setup setup/Weir-win-Setup.exe --version "$BUILD_VERSION"

      - name: Upload scenario logs and results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-scenarios-${{ matrix.shard }}
          if-no-files-found: warn
          path: artifacts/scenarios-in-ci/**
