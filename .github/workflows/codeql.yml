# Static security analysis for Weir source.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
  # Sundays, 09:37 UTC (Sunday 20:37 Sydney, AEDT). Off the top of the hour. GitHub may start a scheduled run late on busy days.
    - cron: "37 9 * * 0"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # See ci.yml's own concurrency block: cancel a superseded pull request run, never a push to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Uploading the results to code scanning is the one write this workflow needs.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # C# without a build: CodeQL's build-mode none reads the source directly, so this job needs
          # no .NET SDK setup and cannot fail on a build step.
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Scans the workflow YAML itself for injection (untrusted github.event.* reaching run:,
          # unpinned actions, etc.) — same build-mode none, no extra setup.
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
