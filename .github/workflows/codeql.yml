# Static security analysis for Weir source.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
  # Sundays, 09:37 UTC (Sunday 20:37 Sydney, AEDT). Off the top of the hour. GitHub may start a scheduled run late on busy days.
    - cron: "37 9 * * 0"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # See ci.yml's own concurrency block: cancel a superseded pull request run, never a push to main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    # Measured (run 42129921955): the C# leg takes about 11 minutes (SDK and restore 1 minute, the traced builds of the
    # server and the tray 6.5 minutes, the queries 2.5 minutes); the others take 1 to 1.5 minutes. Twice the slowest leg.
    timeout-minutes: 22
    permissions:
      contents: read
      # Uploading the results to code scanning is the one write this workflow needs.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # C# is traced through a real build of both solutions (build-mode manual), so CodeQL sees the compiled
          # code with its resolved references instead of guessing from source (build-mode none is flagged as
          # low analysis quality). One job covers the server and the tray under the one category /language:csharp.
          # Windows, because the tray targets Windows and cannot be built anywhere else; the server builds there too
          # (ci.yml's server-windows leg).
          - language: csharp
            build-mode: manual
            runner: windows-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          # Scans the workflow YAML itself for injection (untrusted github.event.* reaching run:,
          # unpinned actions, etc.) — same build-mode none, no extra setup.
          - language: actions
            build-mode: none
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pinned SDK, with the same package cache as ci.yml. Not needed by the build-mode none languages.
      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: |
            apps/server/**/packages.lock.json
            apps/tray/**/packages.lock.json

      # Restored before CodeQL starts tracing, so the traced build is compilation only. Locked, as in ci.yml. Run from
      # apps/server so its global.json picks the pinned SDK: from the repository root no global.json applies and the
      # runner image's newer preinstalled SDK is used, which brings newer trimming tools (ILLink.Tasks 10.0.14, the
      # lock files hold 10.0.11) and fails the locked restore with NU1004. The shell is bash because the default
      # PowerShell step reports only the last command's exit code: the failed restore above was hidden by the tray
      # restore after it, and the job went on to analyse a server that was never compiled.
      - name: Restore Weir server and tray (locked)
        if: matrix.language == 'csharp'
        working-directory: apps/server
        shell: bash
        run: |
          dotnet --version
          dotnet restore Weir.slnx --locked-mode
          dotnet restore ../tray/Weir.Tray.slnx --locked-mode

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      # Everything in the two solutions is compiled from scratch (no incremental reuse, no shared compiler server),
      # because CodeQL only extracts what it sees compiled. No tests run.
      - name: Build Weir server and tray
        if: matrix.language == 'csharp'
        working-directory: apps/server
        shell: bash
        run: |
          dotnet build Weir.slnx -c Release --no-restore --no-incremental -p:UseSharedCompilation=false
          dotnet build ../tray/Weir.Tray.slnx -c Release --no-restore --no-incremental -p:UseSharedCompilation=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
