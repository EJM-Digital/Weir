# Weir CI: the server on Linux and Windows, the web app, the E2E smoke, the contract suite (ci-contract.yml), the
# tray, the coverage check, and the Docker and Windows package smokes (ci-packaging.yml). Triggers: push to main,
# pull_request, workflow_dispatch, and a nightly schedule that runs only the Windows legs.
#
# The Windows legs of the contract suite (contract-windows) and the Windows package smoke and scenario shards
# (packaging-windows) cost twice what a Linux job does, so docs/ci-cost.md sets when they run: on a push to main, on the
# nightly run, by hand and before a tag as ever, but on a pull request only when it touches a Windows path (the
# `windows` filter below, kept honest by scripts/check-windows-paths.mjs). The release asks for a passing run of them on
# the tagged commit or an earlier one with the same shipped files (scripts/verify-heavy-ci-for-release.mjs), which is why
# ci-passed has a step that succeeds only when they ran.
#
# `changes` turns the paths a change touches into one run_* flag per job, and each job runs only when its flag
# is true; a manual run runs everything. `ci-passed` needs every job and passes only when each job that was due
# passed and each job that was not due was skipped (scripts/ci-passed.mjs). It is the one check main's ruleset
# requires, and the one the release asks for on the tagged commit (scripts/verify-ci-for-release.mjs).
# scripts/check-release-workflow-gates.mjs checks that ci-passed needs every job here.
#
# server-windows and tray use the same path filter on a push to main as on a pull request, so a commit
# that only touched, say, a release notes file runs neither again: the tree those jobs cover has not
# changed since the last commit that did, and that commit already proved it on that same filter (#804 -
# a release no longer needs a version-bump commit, so this is what keeps cutting one cheap). packaging
# is different: its own pull-request filter is deliberately narrow (see the `packaging` filter below), so
# a server or web change that is not itself a packaging-path change still forces packaging on the next
# push to main, the one place nothing has tested it yet in that tree. A workflow-file change or a manual
# run still forces every job, on either event.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          For the golden path: the release this commit is meant to become, e.g. 1.0.0-rc.4. The Windows build then
          reports 1.0.0-rc.4+<short sha>. Leave empty for the placeholder version.
        type: string
        required: false
        default: ""

concurrency:
  # The nightly run has a group of its own: a run waiting behind another in one group is replaced by the next, and it
  # must never replace a push to main.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  # A superseded pull request run is cancelled; a push to main never is, so two merges landing close
  # together each get a real, uncancelled run instead of leaving a cancelled one on main's history.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_server_linux: ${{ steps.flags.outputs.run_server_linux }}
      run_server_windows: ${{ steps.flags.outputs.run_server_windows }}
      run_server_audit: ${{ steps.flags.outputs.run_server_audit }}
      run_web: ${{ steps.flags.outputs.run_web }}
      run_web_audit: ${{ steps.flags.outputs.run_web_audit }}
      run_e2e: ${{ steps.flags.outputs.run_e2e }}
      run_contract: ${{ steps.flags.outputs.run_contract }}
      run_contract_windows: ${{ steps.flags.outputs.run_contract_windows }}
      run_tray: ${{ steps.flags.outputs.run_tray }}
      run_coverage: ${{ steps.flags.outputs.run_coverage }}
      run_coverage_out_of_process: ${{ steps.flags.outputs.run_coverage_out_of_process }}
      run_packaging: ${{ steps.flags.outputs.run_packaging }}
      run_packaging_windows: ${{ steps.flags.outputs.run_packaging_windows }}
      run_arm64: ${{ steps.flags.outputs.run_arm64 }}
      contract_areas: ${{ steps.areas.outputs.areas }}
      e2e_shards: ${{ steps.e2e_shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One contract leg per area in the contract project's areas.json, so a new area gets its leg without editing this file.
      - name: Contract areas
        id: areas
        run: |
          areas="$(jq -c '[.areas[].name]' apps/server/tests/Weir.Contract.Tests/areas.json)"
          echo "Contract areas: $areas"
          echo "areas=$areas" >> "$GITHUB_OUTPUT"

      # The browser tests share one server and run one at a time, so they are split over jobs by test count
      # (scripts/e2e-shards.mjs): a new test class is in a shard without editing this file, and a shard is added before
      # one nears its timeout.
      - name: E2E shards
        id: e2e_shards
        run: |
          shards="$(node scripts/e2e-shards.mjs --matrix)"
          node scripts/e2e-shards.mjs --summary
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        with:
          filters: |
            server:
              - 'apps/server/**'
            web:
              - 'apps/web/**'
            harness:
              - 'scripts/**'
            tray:
              - 'apps/tray/**'
              # The tray imports the server's build rules and product version.
              - 'apps/server/Directory.Build.props'
              # The tray's tests read the files the tray and the server write for each other.
              - 'apps/server/tests/fixtures/tray-files/**'
            # Only files the package smokes actually exercise: the packaged artefacts (Dockerfile, docker/**,
            # compose.yaml, .dockerignore, packaging/**, the tray), the host entry point that ships inside them
            # (apps/server/src/Weir.Host/**, not the whole server), the database migrations the upgrade smoke carries an
            # old volume across, the smoke scripts themselves, and the workflow that runs them. A server or web change
            # that is not in this list still reaches the packaging smokes on the next push to main (see main_push
            # below), just not on every pull request.
            packaging:
              - 'Dockerfile'
              - 'docker/**'
              - 'compose.yaml'
              - '.dockerignore'
              - 'packaging/**'
              - 'apps/tray/**'
              - 'apps/server/src/Weir.Host/**'
              - 'apps/server/tools/Weir.LiveAudit/**'
              - 'scripts/smoke-windows-package.ps1'
              - 'scripts/smoke-windows-recover.ps1'
              - 'scripts/wait-for-health.mjs'
              - 'scripts/docker-compose-smoke.mjs'
              - 'scripts/docker-smoke/**'
              - 'scripts/scenarios-in-ci.mjs'
              - 'scripts/scenarios-ci/**'
              - 'scripts/find-previous-release.mjs'
              - 'scripts/semver.mjs'
              - 'scripts/repository.mjs'
              - 'scripts/repository.ps1'
              - 'scripts/ffmpeg-cache-key.mjs'
              - 'scripts/ffmpeg-pin.mjs'
              - 'scripts/install-ffmpeg-linux.mjs'
              - 'apps/server/src/Weir.Infrastructure/Migrations/**'
              - 'apps/server/src/Weir.Infrastructure/Sqlite/**'
              # The recovery command the package smokes run (PLAT-20).
              - 'apps/server/src/Weir.Infrastructure/Auth/Recover*'
              - '.github/workflows/ci-packaging.yml'
            # What a Windows leg tests that a Linux one cannot: the tray, the server code that is Windows-only (the *.Windows.cs
            # files, the firewall, the Velopack updater, the Win32 calls) or branches on the platform for file locking and
            # paths, the host the installer packs, the database migrations a Windows upgrade carries across, the installer
            # packaging, the scenario scripts and the contract suite's own project. scripts/check-windows-paths.mjs fails
            # when a server file that is Windows-only is not matched here.
            windows:
              - 'apps/tray/**'
              - 'apps/server/Directory.Build.props'
              - 'apps/server/Directory.Packages.props'
              - 'apps/server/global.json'
              - 'apps/server/src/**/*.Windows.cs'
              - 'apps/server/src/Weir.Host/**'
              - 'apps/server/src/Weir.Core/Updates/**'
              - 'apps/server/src/Weir.Infrastructure/WeirPlatformServices.cs'
              - 'apps/server/src/Weir.Infrastructure/Browse/**'
              - 'apps/server/src/Weir.Infrastructure/LibraryMode/**'
              - 'apps/server/src/Weir.Infrastructure/IO/**'
              - 'apps/server/src/Weir.Infrastructure/Runtime/**'
              - 'apps/server/src/Weir.Infrastructure/SystemReadings/**'
              - 'apps/server/src/Weir.Infrastructure/Processing/OutputOwnership.cs'
              - 'apps/server/src/Weir.Infrastructure/Processing/RemuxPass/FileLifecycle.cs'
              - 'apps/server/src/Weir.Infrastructure/Processing/RemuxPass/SourceFiles.cs'
              - 'apps/server/src/Weir.Infrastructure/Migrations/**'
              - 'apps/server/src/Weir.Infrastructure/Sqlite/**'
              - 'apps/server/src/Weir.Infrastructure/Auth/Recover*'
              - 'apps/server/tests/Weir.Contract.Tests/**'
              - 'apps/server/tools/Weir.LiveAudit/**'
              - 'packaging/windows/**'
              - 'scripts/smoke-windows-package.ps1'
              - 'scripts/smoke-windows-recover.ps1'
              - 'scripts/install-media-tools-windows.ps1'
              - 'scripts/wait-for-health.mjs'
              - 'scripts/scenarios-in-ci.mjs'
              - 'scripts/scenarios-ci/**'
              - 'scripts/scenarios/**'
              - 'scripts/find-previous-release.mjs'
              - 'scripts/prune-release-feed.mjs'
              - 'scripts/pinned-download.mjs'
              - 'scripts/semver.mjs'
              - 'scripts/repository.mjs'
              - 'scripts/repository.ps1'
              - 'scripts/ffmpeg-cache-key.mjs'
              - 'scripts/ffmpeg-pin.mjs'
              - 'scripts/mkvtoolnix-cache-key.mjs'
              - 'scripts/mkvtoolnix-pin.mjs'
            # The real ffmpeg, ffprobe and mkvmerge the server tests run against (their pins and installers) and the check
            # that every real-tool test ran. The workflows filter below covers the actions that call them.
            media_tools:
              - 'packaging/windows/build-velopack-vendored-media-tools.ps1'
              - 'packaging/windows/pinned-download.ps1'
              - 'scripts/repository.mjs'
              - 'scripts/repository.ps1'
              - 'scripts/check-real-tool-tests.mjs'
              - 'scripts/check-contract-real-tool-tests.mjs'
              - 'scripts/ffmpeg-cache-key.mjs'
              - 'scripts/ffmpeg-pin.mjs'
              - 'scripts/install-ffmpeg-linux.mjs'
              - 'scripts/install-media-tools-windows.ps1'
              - 'scripts/install-mkvtoolnix-linux.mjs'
              - 'scripts/mkvtoolnix-cache-key.mjs'
              - 'scripts/mkvtoolnix-pin.mjs'
              - 'scripts/pinned-download.mjs'
              - 'scripts/summarize-test-results.mjs'
            docker:
              - 'docker/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'scripts/docker-smoke/arm64-scenario.mjs'
            # The floors every test leg is held to: a change to them is checked against a fresh measurement of all three.
            coverage_floors:
              - 'docs/coverage/floors.json'
            workflows:
              - '.github/**'

      # Web checks also run for server and harness changes: the server embeds the OpenAPI document the web
      # app's generated types come from, and the E2E smoke serves the built web app. The
      # audits and the E2E smoke run on pull requests; a push to main was a squash merge its pull request
      # already ran them on. The arm64 image builds under QEMU, which is slow, so only when the image changes.
      - name: Which jobs are due
        id: flags
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ steps.filter.outputs.server }}
          WEB: ${{ steps.filter.outputs.web }}
          HARNESS: ${{ steps.filter.outputs.harness }}
          TRAY: ${{ steps.filter.outputs.tray }}
          FLOORS: ${{ steps.filter.outputs.coverage_floors }}
          PACKAGING: ${{ steps.filter.outputs.packaging }}
          WINDOWS: ${{ steps.filter.outputs.windows }}
          MEDIA_TOOLS: ${{ steps.filter.outputs.media_tools }}
          DOCKER: ${{ steps.filter.outputs.docker }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          set -euo pipefail
          either() { for value in "$@"; do if [ "$value" = true ]; then echo true; return; fi; done; echo false; }
          both() { for value in "$@"; do if [ "$value" != true ]; then echo false; return; fi; done; echo true; }
          manual=$([ "$EVENT" = workflow_dispatch ] && echo true || echo false)
          main_push=$([ "$EVENT" = push ] && echo true || echo false)
          nightly=$([ "$EVENT" = schedule ] && echo true || echo false)
          all=$(either "$manual" "$WORKFLOWS")
          on_pull_request() { if [ "$main_push" = true ]; then echo false; else echo "$1"; fi; }
          # A Windows leg is due when its Linux twin is: on a push to main, by hand and when a workflow changes. A pull request
          # also needs a Windows path in it, and the nightly run (which the Linux twins skip) always runs them.
          windows_paths=$(either "$all" "$WINDOWS" "$MEDIA_TOOLS")
          windows_leg() {
            if [ "$nightly" = true ]; then echo true
            elif [ "$EVENT" = pull_request ]; then both "$1" "$windows_paths"
            else echo "$1"; fi
          }

          web=$(either "$all" "$SERVER" "$HARNESS" "$WEB")
          # The unit tests of all three projects, the contract suite and the E2E smoke run to measure coverage when the floors change.
          web_tests=$(either "$web" "$FLOORS")
          contract_tests=$(either "$all" "$SERVER" "$FLOORS")
          e2e_tests=$(on_pull_request "$web_tests")
          tray_tests=$(either "$all" "$TRAY" "$FLOORS")
          # packaging's own filter stays narrow on a pull request (see below); a server or web change
          # outside it still needs packaging tested once it lands on main, since nothing else will.
          packaging_reached_by_main=$(both "$main_push" "$(either "$SERVER" "$WEB")")
          packaging_due=$(either "$all" "$PACKAGING" "$packaging_reached_by_main")
          {
            echo "run_server_linux=$(either "$all" "$SERVER" "$MEDIA_TOOLS" "$FLOORS")"
            echo "run_server_windows=$(either "$all" "$SERVER" "$MEDIA_TOOLS" "$FLOORS")"
            echo "run_server_audit=$(on_pull_request "$(either "$all" "$SERVER")")"
            echo "run_web=$web_tests"
            echo "run_web_audit=$(on_pull_request "$(either "$all" "$WEB")")"
            echo "run_e2e=$e2e_tests"
            echo "run_contract=$contract_tests"
            echo "run_tray=$tray_tests"
            echo "run_coverage=$(either "$web_tests" "$tray_tests")"
            # The out-of-process figure is the contract suite and the E2E smoke together: judged only when both ran.
            echo "run_coverage_out_of_process=$(both "$contract_tests" "$e2e_tests")"
            echo "run_packaging=$packaging_due"
            echo "run_packaging_windows=$(windows_leg "$packaging_due")"
            echo "run_contract_windows=$(windows_leg "$contract_tests")"
            echo "run_arm64=$(either "$manual" "$DOCKER")"
          } | tee -a "$GITHUB_OUTPUT"

  # Cheap checks on the repository itself, on every change.
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # issues: read lets the coverage register check ask which coverage issues are open.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Weir agent documentation map
        run: node scripts/check-agent-docs.mjs

      - name: GitHub Actions pin check
        run: node scripts/check-github-action-pins.mjs

      - name: Workflow permissions, timeouts and tests that must fail the job
        run: |
          node scripts/check-workflow-hygiene.mjs

      - name: Dockerfile node major matches .node-version
        run: node scripts/check-node-docker-version.mjs

      - name: No test starts a system console program
        run: |
          node scripts/check-test-console-programs.mjs

      - name: No test waits for the wall clock
        run: |
          node scripts/check-wall-clock-waits.mjs

      - name: No Python in the repository
        run: |
          node scripts/check-no-python.mjs

      # A fork runs its own copy of this workflow under its own name, so only the project's own repository is held to it.
      - name: The repository's owner and name are written once per language
        env:
          RUNNING_REPOSITORY: ${{ github.event.repository.fork == false && github.repository || '' }}
        run: |
          node scripts/check-repository-owner.mjs ${RUNNING_REPOSITORY:+--repository "$RUNNING_REPOSITORY"}

      - name: Nothing private in the README, the docs and the release notes
        run: |
          node scripts/check-public-privacy.mjs

      - name: Contract areas match their test classes
        run: |
          node scripts/check-contract-areas.mjs

      # A Windows-only server file outside the `windows` path filter would change without the Windows legs running (docs/ci-cost.md).
      - name: The windows path filter matches the Windows-only server files
        run: |
          node scripts/check-windows-paths.mjs

      - name: The recordings of Deluno, Sonarr and Radarr match the manifests they were checked in with
        run: |
          node scripts/check-recorded-manifest.mjs

      - name: The recordings of Weir are of a recent build
        run: |
          node scripts/check-recorded-freshness.mjs

      - name: Every recording is replayed or explained, and the drift check compares what it should
        run: |
          node scripts/check-recorded-replays.mjs

      - name: The release fixtures are whole, and no more than one release behind
        run: |
          node scripts/check-release-fixtures.mjs

      - name: Every server event type has a title
        run: |
          node scripts/check-event-titles.mjs

      # The mutation workflow (mutation.yml) runs weekly and judges the scores; here a pull request is held to the other
      # half of the ratchet, that a floor in docs/coverage/mutation-floors.json only goes up without its own entry.
      - name: Mutation floors - the file, the matrix and the ratchet
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--floors docs/coverage/mutation-floors.json --floors-only)
          if [ -n "$BEFORE" ] && git fetch --no-tags --depth=1 origin "$BEFORE" && git show FETCH_HEAD:docs/coverage/mutation-floors.json > base-mutation-floors.json; then
            args+=(--base-floors base-mutation-floors.json)
          else
            rm -f base-mutation-floors.json
            echo "No earlier floors file to compare with."
          fi
          node scripts/check-mutation-floors.mjs "${args[@]}"

      # Everything the coverage figures leave out is listed in docs/coverage/exclusions.json with a kind and a reason (#1060).
      - name: Coverage exclusions each have a reason
        run: |
          node scripts/check-coverage-exclusions.mjs

      # The register is read against the code, against the open coverage issues, and against the register as it was before this change:
      # on a pull request the base commit's, on a push to main the previous commit's. The gaps may not go up from that count
      # (scripts/check-coverage-register.mjs), so no gap count is kept in the file for pull requests to conflict on.
      - name: Coverage register accounts for everything and has no more gaps
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--gh --report)
          if [ -n "$BEFORE" ] && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            args+=(--base FETCH_HEAD)
          else
            echo "No earlier commit to compare the register with."
          fi
          node scripts/check-coverage-register.mjs "${args[@]}"

      - name: Upload the coverage register statistics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-register
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/coverage-register.md

      - name: Release and CI gate rules
        run: |
          node scripts/check-release-workflow-gates.mjs

      # Every script test, run once, under node's own coverage (#1060), held to the node-scripts floor in docs/coverage/floors.json.
      # Node reports only the scripts a test loaded; check-coverage-floors.mjs counts the others as not run. Each
      # --test-coverage-exclude is listed in docs/coverage/exclusions.json with its reason (scripts/check-coverage-exclusions.mjs).
      - name: Node scripts - every test, measured against the floor
        run: |
          mkdir -p artifacts/node-coverage
          node --test --experimental-test-coverage "--test-coverage-include=scripts/**/*.mjs" \
            "--test-coverage-exclude=scripts/**/*.test.mjs" \
            "--test-coverage-exclude=scripts/scenarios-ci/windows-*.mjs" \
            "--test-coverage-exclude=scripts/scenarios-ci/tray-*.mjs" \
            "--test-coverage-exclude=scripts/scenarios-ci/files-*.mjs" \
            "--test-coverage-exclude=scripts/scenarios-ci/install-hooks.mjs" \
            "--test-coverage-exclude=scripts/docker-smoke/**" \
            "--test-coverage-exclude=scripts/docker-compose-smoke.mjs" \
            "--test-coverage-exclude=scripts/dev-reset-auth.mjs" \
            "--test-coverage-exclude=scripts/stop-dev-api-port.mjs" \
            "--test-coverage-exclude=scripts/stop-dev-web-port.mjs" \
            "--test-coverage-exclude=scripts/merge-web-coverage-reports.mjs" \
            "--test-coverage-exclude=scripts/scenarios-ci/shard-runners.mjs" \
            "--test-coverage-exclude=scripts/pre-push.mjs" \
            "--test-coverage-exclude=scripts/attribute-pool-stalls.mjs" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=artifacts/node-coverage/lcov.info \
            "scripts/**/*.test.mjs"
          node scripts/check-coverage-floors.mjs --floors docs/coverage/floors.json --node-scripts artifacts/node-coverage

  server-linux:
    needs: changes
    if: needs.changes.outputs.run_server_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      # From apps/server, so its global.json picks the pinned SDK: the lock files record the trimming tools that
      # SDK brings (Weir.Core is trimmable), and a runner's newer default SDK would not match them.
      - name: Restore Weir server (locked)
        working-directory: apps/server
        run: dotnet restore Weir.slnx --locked-mode

      # Warnings are errors, and so are the unused-member analyzers (IDE0051/IDE0052, apps/server/.editorconfig):
      # that is the server's dead-code guard.
      - name: Build Weir server (warnings are errors)
        working-directory: apps/server
        run: dotnet build Weir.slnx -warnaserror --no-restore

      # The real-tool tests (RealFfmpegTests, MkvmergeRealTests, RemuxPassRealFfmpegTests) run the real ffmpeg, ffprobe and
      # mkvmerge. They skip themselves where those are missing, and a skip reads as a pass, so the pinned tools are
      # installed here, WEIR_REQUIRE_REAL_TOOLS turns a missing tool into a failure, and the check after the tests
      # fails the leg unless every one of them ran.
      - name: Set up the real media tools
        id: media-tools
        uses: ./.github/actions/setup-real-media-tools
        timeout-minutes: 10

      # Category=Stress (the SQLite pool-race test) runs several seconds of wall clock across 8 threads and
      # would starve every other test running alongside it here; ci-stress.yml runs it nightly instead.
      # Category=Contract and Category=E2E start a real server (and a browser): the contract and e2e-smoke jobs run them.
      - name: Test Weir server
        working-directory: apps/server
        env:
          WEIR_FFMPEG_DIR: ${{ steps.media-tools.outputs.ffmpeg-dir }}
          WEIR_MKVTOOLNIX_DIR: ${{ steps.media-tools.outputs.mkvtoolnix-dir }}
          WEIR_REQUIRE_REAL_TOOLS: "1"
        run: >-
          dotnet test Weir.slnx --no-build --filter "Category!=Stress&Category!=Contract&Category!=E2E" --logger trx
          --collect:"XPlat Code Coverage" --settings coverage.runsettings

      - name: Summarize server test results
        if: ${{ !cancelled() }}
        run: node scripts/summarize-test-results.mjs trx apps/server "Server tests (Linux)"

      - name: Every real-tool test ran
        if: ${{ !cancelled() }}
        run: node scripts/check-real-tool-tests.mjs apps/server linux "Real-tool tests (Linux)"

      - name: Upload server test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-test-results-linux
          if-no-files-found: ignore
          retention-days: 1
          path: apps/server/**/TestResults/*.trx

      - name: Upload server coverage (Linux)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-server-linux
          if-no-files-found: ignore
          retention-days: 1
          path: apps/server/tests/*/TestResults/*/coverage.*.xml

      - name: Server dependency vulnerability scan
        if: needs.changes.outputs.run_server_audit == 'true'
        run: node scripts/check-dotnet-vulnerabilities.mjs apps/server/Weir.slnx

  # The server's Windows-only code paths (file identity, same-folder renames, sharing violations) only run here.
  server-windows:
    needs: changes
    if: needs.changes.outputs.run_server_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      # From apps/server, so its global.json picks the pinned SDK: the lock files record the trimming tools that
      # SDK brings (Weir.Core is trimmable), and a runner's newer default SDK would not match them.
      - name: Restore Weir server (locked)
        working-directory: apps/server
        run: dotnet restore Weir.slnx --locked-mode

      - name: Build Weir server (warnings are errors)
        working-directory: apps/server
        run: dotnet build Weir.slnx -warnaserror --no-restore

      # The pinned tools the Windows package ships, for the real-tool tests (see server-linux's "Set up the real media tools").
      - name: Set up the real media tools
        id: media-tools
        uses: ./.github/actions/setup-real-media-tools
        timeout-minutes: 10

      # See server-linux's own "Test Weir server" step: ci-stress.yml runs Category=Stress nightly instead.
      - name: Test Weir server
        working-directory: apps/server
        env:
          WEIR_FFMPEG_DIR: ${{ steps.media-tools.outputs.ffmpeg-dir }}
          WEIR_MKVTOOLNIX_DIR: ${{ steps.media-tools.outputs.mkvtoolnix-dir }}
          WEIR_REQUIRE_REAL_TOOLS: "1"
        run: >-
          dotnet test Weir.slnx --no-build --filter "Category!=Stress&Category!=Contract&Category!=E2E" --logger trx
          --collect:"XPlat Code Coverage" --settings coverage.runsettings

      - name: Summarize server test results
        if: ${{ !cancelled() }}
        run: node scripts/summarize-test-results.mjs trx apps/server "Server tests (Windows)"

      - name: Every real-tool test ran
        if: ${{ !cancelled() }}
        run: node scripts/check-real-tool-tests.mjs apps/server windows "Real-tool tests (Windows)"

      - name: Upload server test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: server-test-results-windows
          if-no-files-found: ignore
          retention-days: 1
          path: apps/server/**/TestResults/*.trx

      - name: Upload server coverage (Windows)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-server-windows
          if-no-files-found: ignore
          retention-days: 1
          path: apps/server/tests/*/TestResults/*/coverage.*.xml

  # The production web build, once, for the E2E smoke to serve.
  web-dist:
    needs: changes
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Weir web - install and build (tokens, types, bundle budget)
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Nothing private in the built web app
        run: node scripts/check-public-privacy.mjs

      - name: Upload web dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-web-dist
          if-no-files-found: error
          retention-days: 1
          path: apps/web/dist

  web:
    needs: changes
    if: needs.changes.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The build itself is web-dist's. The unit tests run with coverage (vite.config.ts), which also fails them
      # when the app falls below its floor in docs/coverage/floors.json.
      - name: Weir web - install, API types, lint, format, unit tests
        working-directory: apps/web
        run: |
          npm ci
          npm run api:types:check
          npm run lint
          npm run format
          npm run test:coverage

      - name: Upload web coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web
          if-no-files-found: ignore
          retention-days: 1
          path: apps/web/coverage

      # After the web install above, so it reuses apps/web/node_modules for Knip.
      - name: Weir dead-code guard
        run: node scripts/check-dead-code.mjs

      # scripts/npm-audit-retry.mjs retries only a registry-side failure (an outage or dropped
      # connection); a real High/Critical advisory fails immediately unless apps/web/dependency-audit-exceptions.json
      # approves it with a mitigation and an expiry.
      - name: Frontend dependency vulnerability scan
        if: needs.changes.outputs.run_web_audit == 'true'
        working-directory: apps/web
        run: node ../../scripts/npm-audit-retry.mjs --level=high --exceptions=dependency-audit-exceptions.json

  # The browser tests, one job per shard (scripts/e2e-shards.mjs), all at once.
  e2e-smoke:
    name: e2e-smoke (shard ${{ matrix.shard }})
    needs: [changes, web-dist]
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.e2e_shards) }}
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      # The E2E project builds the server (Weir.Host) before itself and starts it as a process, serving the web
      # app downloaded below.
      - name: Build the E2E tests and the server under test
        working-directory: apps/server
        run: |
          dotnet restore tests/Weir.E2E.Tests --locked-mode
          dotnet build tests/Weir.E2E.Tests --no-restore

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The accessibility check in the browser tests runs axe-core, which the web app's own tests install.
      - name: Install the web app's packages (axe-core for the accessibility check)
        working-directory: apps/web
        run: npm ci --ignore-scripts

      # The web app the browser tests drive is built here, not downloaded from web-dist: it is the same build with Istanbul
      # instrumentation (WEIR_WEB_COVERAGE, apps/web/vite.config.ts), so the tests can say which of its code they ran (docs/coverage/README.md).
      - name: Build the web app with coverage instrumentation
        working-directory: apps/web
        env:
          WEIR_WEB_COVERAGE: "1"
        run: npx vite build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/server/Directory.Packages.props') }}

      - uses: ./.github/actions/apt-fail-fast

      # The install script is generated by the build, for the Playwright version in Directory.Packages.props. The
      # browser itself comes from the cache when the version has not changed; the system libraries it needs do not
      # (they live outside it), so those are installed every time, with apt told to retry and give up on a dead
      # mirror instead of waiting for the job's timeout.
      - name: Install the Playwright browser
        timeout-minutes: 10
        run: |
          pwsh apps/server/tests/Weir.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # The pinned collector that follows the server these tests start as its own process (#1081, docs/coverage/README.md).
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage --version 18.11.2

      # A failed browser test fails the job; nothing is retried (an intermittent test is a bug to root-cause).
      # Each server is asked to stop instead of being killed (WEIR_CONTRACT_COVERAGE), so it writes what it ran.
      - name: Weir E2E smoke (Playwright + real .NET server), shard ${{ matrix.shard }}
        id: e2e
        working-directory: apps/server
        env:
          WEIR_E2E: "1"
          WEIR_CONTRACT_COVERAGE: "1"
          WEIR_WEB_COVERAGE_DIR: ${{ runner.temp }}/web-coverage/tests
          SHARD: ${{ matrix.shard }}
        run: |
          filter="$(node ../../scripts/e2e-shards.mjs --shard "$SHARD")"
          dotnet-coverage collect --settings coverage.out-of-process.xml --output-format cobertura \
            --output "$RUNNER_TEMP/out-of-process/coverage.cobertura.xml" --nologo -- \
            dotnet test tests/Weir.E2E.Tests --no-build --logger trx --filter "$filter"

      # A shard that passed and wrote no coverage fails here, so the coverage check never reads a gap as "nothing to measure".
      - name: Upload the server coverage this shard measured
        if: ${{ steps.e2e.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-out-of-process-e2e-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/out-of-process/coverage.cobertura.xml

      # Each test wrote what its pages ran; one file per shard is what the coverage job merges.
      - name: Merge the web coverage this shard measured
        if: ${{ steps.e2e.outcome == 'success' }}
        run: node scripts/merge-web-coverage.mjs --parts --out "${{ runner.temp }}/web-coverage/shard" "${{ runner.temp }}/web-coverage/tests"

      - name: Upload the web coverage this shard measured
        if: ${{ steps.e2e.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-web-e2e-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/web-coverage/shard/coverage-final.json

      - name: Summarize E2E smoke results
        if: ${{ !cancelled() }}
        run: node scripts/summarize-test-results.mjs trx apps/server/tests/Weir.E2E.Tests/TestResults "Browser smoke tests, shard ${{ matrix.shard }}"

      - name: Upload E2E smoke results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 1
          path: apps/server/tests/Weir.E2E.Tests/TestResults*/*.trx

      # What a failed browser test kept (apps/server/tests/Weir.E2E.Tests/README.md, "When a test fails"): the full error, the
      # trace, a screenshot and the logs.
      - name: Upload E2E failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-failure-evidence-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/e2e-failures

  # The contract suite, one leg per area (ci-contract.yml), on Linux here and on Windows in the job below.
  contract:
    needs: changes
    if: needs.changes.outputs.run_contract == 'true'
    uses: ./.github/workflows/ci-contract.yml
    with:
      areas: ${{ needs.changes.outputs.contract_areas }}
      platforms: '["linux"]'

  # The Windows legs of the contract suite: on a push to main, on the nightly run and by hand like the Linux ones, on a pull
  # request only when it touches a Windows path (docs/ci-cost.md).
  contract-windows:
    needs: changes
    if: needs.changes.outputs.run_contract_windows == 'true'
    uses: ./.github/workflows/ci-contract.yml
    with:
      areas: ${{ needs.changes.outputs.contract_areas }}
      platforms: '["windows"]'

  # The tray's unit tests: port choice, update settings and menu state, the health wait, the access lists of the
  # data folder and the secrets, and which processes the installer may stop.
  tray:
    needs: changes
    if: needs.changes.outputs.run_tray == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/tray/**/packages.lock.json

      - name: Restore Weir tray (locked)
        run: dotnet restore apps/tray/Weir.Tray.slnx --locked-mode

      # Warnings are errors through apps/tray/Directory.Build.props.
      - name: Build Weir tray
        run: dotnet build apps/tray/Weir.Tray.slnx --no-restore

      - name: Test Weir tray
        run: dotnet test apps/tray/Weir.Tray.slnx --no-build --logger trx --collect:"XPlat Code Coverage" --settings apps/tray/coverage.runsettings

      - name: Summarize tray test results
        if: ${{ !cancelled() }}
        run: node scripts/summarize-test-results.mjs trx apps/tray "Tray tests"

      - name: Upload tray test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tray-test-results
          if-no-files-found: ignore
          retention-days: 1
          path: apps/tray/**/TestResults/*.trx

      - name: Upload tray coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-tray
          if-no-files-found: ignore
          retention-days: 1
          path: apps/tray/Weir.Tray.Tests/TestResults/*/coverage.cobertura.xml

  # The coverage check (#976): the per-leg reports of the server (Linux and Windows), the tray and the web app,
  # merged into one report per project and held to the floors in docs/coverage/floors.json. The contract suite and
  # the E2E smoke run the server as a separate process, so they are measured by dotnet-coverage and make a figure of
  # their own beside the unit figure (docs/coverage/README.md). A project whose tests did not run for this change is
  # not judged.
  coverage:
    needs: [changes, server-linux, server-windows, web, tray, contract, contract-windows, e2e-smoke]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.run_coverage == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json

      # One download per leg, each into its own folder. A pattern that matches a single artifact is unpacked
      # straight into `path` rather than a folder named after it, so a run where only one leg ran would lose it.
      - name: Download the server coverage
        if: needs.changes.outputs.run_server_linux == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-server-*
          path: coverage-input

      - name: Download the tray coverage
        if: needs.changes.outputs.run_tray == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-tray
          path: coverage-input/coverage-tray

      - name: Download the web coverage
        if: needs.changes.outputs.run_web == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-web
          path: coverage-input/coverage-web

      # The web app's figure is the unit tests' and the browser tests' together, so it is judged only when both ran (run_e2e follows run_web on a pull request).
      - name: Download the web coverage of the browser tests
        if: needs.changes.outputs.run_web == 'true' && needs.changes.outputs.run_e2e == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-web-e2e-*
          path: coverage-input/web-e2e

      # Every contract area and E2E shard uploaded the server coverage it measured; merged, they are the out-of-process figure.
      - name: Download the out-of-process server coverage
        if: needs.changes.outputs.run_coverage_out_of_process == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-out-of-process-*
          path: coverage-input/out-of-process

      # The merge script uses the web app's coverage packages.
      - name: Install the web app's packages (coverage merge)
        if: needs.changes.outputs.run_web == 'true' && needs.changes.outputs.run_e2e == 'true'
        working-directory: apps/web
        run: npm ci --ignore-scripts

      # The unit tests' report and every shard's, laid over each other (scripts/merge-web-coverage.mjs).
      - name: Merge the web coverage
        if: needs.changes.outputs.run_web == 'true' && needs.changes.outputs.run_e2e == 'true'
        run: node scripts/merge-web-coverage.mjs --out coverage/web coverage-input/coverage-web/coverage-final.json coverage-input/web-e2e

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11

      # Linux and Windows name the checkout and the compiler's file-local types differently, which makes
      # ReportGenerator count some classes twice when it merges them (scripts/align-coverage-reports.mjs).
      - name: Make the runners' coverage files name the same things
        run: node scripts/align-coverage-reports.mjs coverage-input "$GITHUB_WORKSPACE"

      # One report per project. The logging code the compiler generates under obj/ is left out. The server's two legs are merged
      # from their OpenCover files: coverlet's Cobertura keeps only a percentage per branch, so a branch the Windows leg takes one
      # way and the Linux leg the other (if (OperatingSystem.IsWindows())) never added up, where OpenCover lists each branch's hits
      # and ReportGenerator unions them (docs/coverage/README.md). The report the floors read is still Cobertura.
      - name: Merge the server coverage
        if: needs.changes.outputs.run_server_linux == 'true'
        run: >-
          reportgenerator "-reports:coverage-input/coverage-server-*/**/coverage.opencover.xml"
          "-targetdir:coverage/server" "-reporttypes:Html;Cobertura;JsonSummary"
          "-filefilters:-*/obj/*;-*\obj\*" "-title:Weir server"

      - name: Merge the tray coverage
        if: needs.changes.outputs.run_tray == 'true'
        run: >-
          reportgenerator "-reports:coverage-input/coverage-tray/**/coverage.cobertura.xml"
          "-targetdir:coverage/tray" "-reporttypes:Html;Cobertura;JsonSummary"
          "-filefilters:-*/obj/*;-*\obj\*" "-title:Weir tray"

      - name: Merge the out-of-process server coverage
        if: needs.changes.outputs.run_coverage_out_of_process == 'true'
        run: >-
          reportgenerator "-reports:coverage-input/out-of-process/**/coverage.cobertura.xml"
          "-targetdir:coverage/out-of-process" "-reporttypes:Html;Cobertura;JsonSummary"
          "-filefilters:-*/obj/*;-*\obj\*" "-title:Weir server, contract suite and E2E smoke"

      # On a pull request the base branch's floors, on a push to main the previous commit's: a floor lower than
      # that one needs its own explanation in the file (scripts/check-coverage-floors.mjs).
      - name: Floors before this change
        if: github.event_name != 'workflow_dispatch'
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git fetch --no-tags --depth=1 origin "$BEFORE" && git show FETCH_HEAD:docs/coverage/floors.json > base-floors.json; then
            echo "Compared with the floors at $BEFORE."
          else
            rm -f base-floors.json
            echo "No earlier floors file to compare with."
          fi

      - name: Coverage against the floors
        env:
          SERVER: ${{ needs.changes.outputs.run_server_linux }}
          TRAY: ${{ needs.changes.outputs.run_tray }}
          WEB: ${{ needs.changes.outputs.run_web == 'true' && needs.changes.outputs.run_e2e == 'true' }}
          OUT_OF_PROCESS: ${{ needs.changes.outputs.run_coverage_out_of_process }}
        run: |
          args=(--floors docs/coverage/floors.json)
          if [ -f base-floors.json ]; then args+=(--base-floors base-floors.json); fi
          if [ "$SERVER" = true ]; then args+=(--server coverage/server); fi
          if [ "$TRAY" = true ]; then args+=(--tray coverage/tray); fi
          if [ "$OUT_OF_PROCESS" = true ]; then args+=(--out-of-process coverage/out-of-process); fi
          if [ "$WEB" = true ]; then args+=(--web coverage/web); fi
          node scripts/check-coverage-floors.mjs "${args[@]}"

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          if-no-files-found: ignore
          retention-days: 14
          path: coverage

  # The Docker package smokes and the Linux scenario shards (ci-packaging.yml).
  packaging:
    needs: changes
    if: needs.changes.outputs.run_packaging == 'true'
    uses: ./.github/workflows/ci-packaging.yml
    with:
      docker: true
      windows: false
      arm64: ${{ needs.changes.outputs.run_arm64 == 'true' }}
      version: ${{ inputs.version || '' }}

  # The Windows package smoke, the update package and the Windows scenario shards (ci-packaging.yml): on a push to main, on the
  # nightly run and by hand like the Docker ones, on a pull request only when it touches a Windows path (docs/ci-cost.md).
  packaging-windows:
    needs: changes
    if: needs.changes.outputs.run_packaging_windows == 'true'
    uses: ./.github/workflows/ci-packaging.yml
    with:
      docker: false
      windows: true
      arm64: false
      version: ${{ inputs.version || '' }}

  # The verdict. `always()` so it reports even when a job it needs failed or was skipped.
  ci-passed:
    needs: [changes, repo-checks, server-linux, server-windows, web-dist, web, e2e-smoke, contract, contract-windows, tray, coverage, packaging, packaging-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Every job that was due passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-passed.mjs

      # Reached only when the Windows contract legs and the Windows scenario shards were due and the step above passed, so a
      # skipped step means the Windows legs did not run. The release reads this step on the tagged commit or an earlier one
      # with the same shipped files (scripts/verify-heavy-ci-for-release.mjs).
      - name: The Windows legs ran and passed
        if: ${{ needs.changes.outputs.run_contract_windows == 'true' && needs.changes.outputs.run_packaging_windows == 'true' }}
        run: echo "The Windows contract legs and the Windows scenario shards ran and passed."
