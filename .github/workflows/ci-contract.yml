# The contract suite (#516), called by ci.yml: apps/server/tests/Weir.Contract.Tests starts the built .NET server as
# a separate process and talks to it only over HTTP (its README.md). One leg per area in that project's areas.json and
# per platform, all at once, rather than one long runner. Windows is the platform people install on, so every area runs
# there too, against the Windows builds of ffmpeg and mkvmerge the package ships (#995).
name: Contract suite

on:
  workflow_call:
    inputs:
      areas:
        description: JSON list of contract area names, one leg each.
        type: string
        required: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  area:
    name: contract (${{ matrix.area }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(inputs.areas) }}
        platform: [linux, windows]
    defaults:
      run:
        shell: bash
    env:
      WEIR_SESSION_SECRET: ${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}-ci-session-secret-32chars-min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The real-tool scenarios (Processing and Libraries) run the real ffmpeg, ffprobe and mkvmerge. They skip themselves
      # where those are missing, and a skip reads as a pass, so the pinned tools are installed here (the same ones the
      # server tests use), WEIR_REQUIRE_REAL_TOOLS turns a missing tool into a failure, and the check after the tests
      # fails the leg unless every scenario of its area ran.
      - name: Set up the real media tools
        id: media-tools
        uses: ./.github/actions/setup-real-media-tools
        timeout-minutes: 10

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      # The contract project builds the server (Weir.Host) and the fake ffprobe/ffmpeg before itself and starts them
      # as processes; it references no server code.
      - name: Build the contract suite and the server under test
        working-directory: apps/server
        run: |
          dotnet restore tests/Weir.Contract.Tests --locked-mode
          dotnet build tests/Weir.Contract.Tests --no-restore

      # `dotnet test` passes when a filter matches nothing, so scripts/check-contract-areas.mjs (repo-checks)
      # guarantees every area in areas.json has test classes.
      - name: Contract suite, area (${{ matrix.area }}, ${{ matrix.platform }})
        id: contract
        working-directory: apps/server
        env:
          CONTRACT_AREA: ${{ matrix.area }}
          WEIR_REQUIRE_REAL_TOOLS: "1"
          WEIR_CONTRACT_REAL_FFMPEG_DIR: ${{ steps.media-tools.outputs.ffmpeg-dir }}
          WEIR_CONTRACT_REAL_MKVTOOLNIX_DIR: ${{ steps.media-tools.outputs.mkvtoolnix-dir }}
          # Keep each server's data folder and log (<folder>/contract-logs) until the leg is known to have passed.
          WEIR_CONTRACT_KEEP_DATA: "1"
          # Every server the suite starts gets its data folder under here, so a failed leg can upload them.
          # TMPDIR is the Linux name; TEMP and TMP are Windows'.
          TMPDIR: ${{ runner.temp }}/weir-contract-data
          TEMP: ${{ runner.temp }}/weir-contract-data
          TMP: ${{ runner.temp }}/weir-contract-data
        run: |
          mkdir -p "$TMPDIR"
          dotnet test tests/Weir.Contract.Tests --no-build --filter "Area=$CONTRACT_AREA" --logger trx

      - name: Summarize contract results
        if: ${{ !cancelled() }}
        env:
          CONTRACT_AREA: ${{ matrix.area }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/summarize-test-results.mjs trx apps/server/tests/Weir.Contract.Tests "Contract suite ($CONTRACT_AREA, $PLATFORM)"

      - name: Every real-tool scenario ran
        if: ${{ !cancelled() }}
        env:
          CONTRACT_AREA: ${{ matrix.area }}
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/check-contract-real-tool-tests.mjs "$CONTRACT_AREA" apps/server/tests/Weir.Contract.Tests "$PLATFORM" "Real-tool scenarios ($CONTRACT_AREA, $PLATFORM)"

      - name: Upload contract results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contract-test-results-${{ matrix.area }}-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 1
          path: apps/server/tests/Weir.Contract.Tests/TestResults/*.trx

      # What each failed test kept (apps/server/tests/Weir.Contract.Tests/README.md, "When a test fails"): its error and the logs
      # of the servers it used, in a folder named for the test. A passing test deletes its own.
      - name: Upload contract failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contract-failure-evidence-${{ matrix.area }}-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/contract-failures

      - name: Upload contract data folders and server logs
        if: ${{ !cancelled() && steps.contract.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weir-contract-data-${{ matrix.area }}-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/weir-contract-data
