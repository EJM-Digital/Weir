# The SQLite pool-race stress test (SqlitePoolRaceStressTests, Category=Stress), excluded from ci.yml's
# normal run because it deliberately runs several seconds of wall clock across 8 threads and would starve
# every other test running alongside it. Runs weekly, on a pull request that touches the pool code or this test, and on demand instead.
name: Stress

on:
  schedule:
  # Sundays, 10:43 UTC (Sunday 21:43 Sydney, AEDT). Off the top of the hour. GitHub may start a scheduled run late on busy days.
    - cron: "43 10 * * 0"
  pull_request:
    paths:
      - apps/server/src/Weir.Infrastructure/Sqlite/**
      - apps/server/tests/Weir.Infrastructure.Tests/Sqlite/SqlitePoolRaceStressTests.cs
      - .github/workflows/ci-stress.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  sqlite-pool-race:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
          cache: true
          cache-dependency-path: apps/server/**/packages.lock.json

      - name: Restore Weir server (locked)
        working-directory: apps/server
        run: dotnet restore Weir.slnx --locked-mode

      - name: Run the pool-race stress test
        working-directory: apps/server
        run: dotnet test Weir.slnx --filter "Category=Stress"
