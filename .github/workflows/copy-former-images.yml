# One-off, run by hand: copies every image Weir published under its former owner (FORMER_IMAGE_REPOSITORY in
# scripts/repository.mjs, 1.0.0-rc.1 to rc.18 and their attestation tags) to the image name of where it lives now,
# digest for digest, and checks each copy, so the old package can be deleted without losing a release. ghcr does not
# forward an old name. Once the copy is verified this file is removed.
name: Copy the former images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copy-former-images
  cancel-in-progress: false

jobs:
  copy:
    name: Copy and check every tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: The two image names
        run: |
          {
            echo "FROM=$(node --input-type=module -e 'const m = await import("./scripts/repository.mjs"); console.log(m.FORMER_IMAGE_REPOSITORY)')"
            echo "TO=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_ENV"

      - name: Install crane, checked against its pinned SHA-256
        run: |
          curl -fsSL -o crane.tgz "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tgz" | sha256sum -c -
          tar -xzf crane.tgz crane
          sudo install crane /usr/local/bin/crane

      - name: Copy every tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | crane auth login ghcr.io -u "$ACTOR" --password-stdin
          crane ls "$FROM" > tags.txt
          echo "$(wc -l < tags.txt) tags under $FROM, copying to $TO"
          while read -r tag; do crane copy "$FROM:$tag" "$TO:$tag"; done < tags.txt

      - name: Every tag has the same digest under both names
        run: |
          failed=0
          while read -r tag; do
            from=$(crane digest "$FROM:$tag"); to=$(crane digest "$TO:$tag")
            if [ "$from" = "$to" ]; then
              echo "same      $tag $from"
            else
              echo "DIFFERENT $tag $from $to"; failed=1
            fi
          done < tags.txt
          {
            echo "### Copied $(wc -l < tags.txt) tags from \`$FROM\` to \`$TO\`"
            if [ "$failed" = 0 ]; then echo "Every tag has the same digest under both names."; else echo "Some tags differ; see the log."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
