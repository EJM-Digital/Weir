name: probe-tray-uia
on:
  push:
    branches: [coverage/windows-tray-shard]
    paths: ['.github/workflows/probe-tray-uia.yml', 'scripts/scenarios-ci/tray-ui.ps1']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: apps/server/global.json
      - name: Build the tray and its stand-in
        shell: pwsh
        run: |
          dotnet publish apps/tray/Weir.Tray -c Release -r win-x64 --self-contained false -o $env:RUNNER_TEMP/probe/tray
          dotnet publish apps/tray/Weir.Tray.StandInServer -c Release -r win-x64 --self-contained false -o $env:RUNNER_TEMP/probe/standin
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP/probe/tray/server/web-dist | Out-Null
          Set-Content $env:RUNNER_TEMP/probe/tray/server/web-dist/index.html '<html></html>'
          Copy-Item $env:RUNNER_TEMP/probe/standin/* $env:RUNNER_TEMP/probe/tray/server -Recurse -Force
          Copy-Item $env:RUNNER_TEMP/probe/tray/server/Weir.Tray.StandInServer.exe $env:RUNNER_TEMP/probe/tray/server/WeirServer.exe
      - name: Probe
        shell: powershell
        run: |
          $ui = "$PWDscriptsscenarios-ci	ray-ui.ps1"
          function Show($title, $text) { Write-Host "::group::$title"; Write-Host $text; Write-Host "::endgroup::" }
          function Ui { param([Parameter(ValueFromRemainingArguments)]$a) powershell -NoProfile -File $ui @a 2>&1 | Out-String }
          $env:WEIR_HOME = "$env:RUNNER_TEMPweir-home"
          $tray = Start-Process "$env:RUNNER_TEMPprobe	rayWeir.exe" -ArgumentList "--port","9361" -PassThru
          Write-Host "tray pid $($tray.Id)"
          for ($i = 0; $i -lt 8; $i++) {
            Show "find running $i" (Ui find-text -Contains running)
            Show "desktop children $i" ((Ui dump -Depth 1) -replace bounds:{[^}]*},?,)
          }
          for ($i = 0; $i -lt 5; $i++) {
            Show "open-menu taskbar $i" (Ui open-menu -TrayProcessId $tray.Id -Via taskbar)
            Start-Sleep -Seconds 1
            $m = Ui menu -TrayProcessId $tray.Id
            Show "menu $i" ($m.Substring(0, [Math]::Min(300, $m.Length)))
            if ($m.Trim() -ne "null" -and $m.Trim()) { break }
          }
          Show "invoke copy" (Ui invoke -TrayProcessId $tray.Id -Item "Copy address")
          Start-Sleep -Seconds 1
          Show "clipboard" (powershell -STA -NoProfile -Command "Get-Clipboard")
          Show "menu after copy" ((Ui menu -TrayProcessId $tray.Id).Length)
          Show "open-menu again" (Ui open-menu -TrayProcessId $tray.Id -Via taskbar)
          Start-Sleep -Seconds 1
          Show "invoke toggle" (Ui invoke -TrayProcessId $tray.Id -Item "Start with Windows")
          Start-Sleep -Seconds 1
          Show "run key" ((Get-ItemProperty "HKCU:SoftwareMicrosoftWindowsCurrentVersionRun" -ErrorAction SilentlyContinue | Out-String))
          Show "menu after toggle" ((Ui menu -TrayProcessId $tray.Id) -replace bounds:{[^}]*},?,)
          Show "invoke change port" (Ui invoke -TrayProcessId $tray.Id -Item "Change port (9361)...")
          Start-Sleep -Seconds 3
          Show "find port window" (Ui find-text -Contains port)
          Show "dump desktop 6" ((Ui dump -Depth 6) -replace bounds:{[^}]*},?, | ForEach-Object { $_.Substring(0, [Math]::Min(12000, $_.Length)) })
          Show "tray log" (Get-Content "$env:WEIR_HOME	ray-host.log" | Out-String)
          Stop-Process -Id $tray.Id -Force
