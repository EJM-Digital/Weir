# Scratch for #1010 (removed before the pull request is opened): runs the new checks alone, and against broken copies of the entrypoint.
name: Explore 1010

on:
  push:
    branches: ["coverage/1010-docker-entrypoint"]

permissions:
  contents: read

jobs:
  node-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - name: The entrypoint tests as they are
        run: node --test scripts/docker-entrypoint.test.mjs 2>&1 | tail -25
      - name: The helper tests
        run: node --test scripts/docker-compose-smoke.test.mjs 2>&1 | tail -8
      - name: The entrypoint tests against main's entrypoint, which says the output settings are ignored
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:docker/entrypoint.sh > docker/entrypoint.sh
          node --test scripts/docker-entrypoint.test.mjs 2>&1 | grep -E "^ℹ (pass|fail)|^✖" | head -20 || true
          git checkout docker/entrypoint.sh
      - name: Each entrypoint check against an entrypoint missing it
        run: sh scripts/explore-1010/mutants.sh node

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Weir Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: weir-ci-smoke
          cache-from: type=gha,scope=weir-ci-amd64
          cache-to: type=gha,mode=max,scope=weir-ci-amd64,ignore-error=true
      - name: Runner
        run: id; docker version --format '{{.Server.Version}}'; sysctl fs.protected_hardlinks
      - name: refusals
        if: ${{ !cancelled() }}
        run: node scripts/docker-compose-smoke.mjs refusals --candidate weir-ci-smoke --logs artifacts/explore
      - name: identity
        if: ${{ !cancelled() }}
        run: node scripts/docker-compose-smoke.mjs identity --candidate weir-ci-smoke --logs artifacts/explore
      - name: data-folder
        if: ${{ !cancelled() }}
        run: node scripts/docker-compose-smoke.mjs data-folder --candidate weir-ci-smoke --logs artifacts/explore
      - name: media
        if: ${{ !cancelled() }}
        run: node scripts/docker-compose-smoke.mjs media --candidate weir-ci-smoke --logs artifacts/explore
      - name: Each container check against an image missing it
        if: ${{ !cancelled() }}
        run: sh scripts/explore-1010/mutants.sh container weir-ci-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: explore-container-logs
          if-no-files-found: warn
          path: artifacts/**

  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Weir Docker image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: weir-ci-smoke:arm64
          cache-from: type=gha,scope=weir-ci-arm64
          cache-to: type=gha,mode=max,scope=weir-ci-arm64,ignore-error=true
      - name: The arm64 check against an image that is not the arm64 image
        continue-on-error: true
        run: |
          docker pull --platform linux/amd64 alpine:3.20
          docker tag alpine:3.20 weir-not-arm64
          if node scripts/docker-compose-smoke.mjs arm64 --candidate weir-not-arm64 --logs artifacts/explore-not-arm64; then echo "SURVIVED: the arm64 check passed on an amd64 image"; else echo "KILLED: the arm64 check failed on an amd64 image"; fi
      - name: Start the arm64 image under QEMU
        run: time node scripts/docker-compose-smoke.mjs arm64 --candidate weir-ci-smoke:arm64 --logs artifacts/explore-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: explore-arm64-logs
          if-no-files-found: warn
          path: artifacts/**
