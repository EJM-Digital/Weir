# Daily look for server code that CI runs reach in some runs and not in others (timing races, data that arrives in different
# pieces), which turns the coverage check red with no change to the code. It reads the coverage of the last day's ci.yml runs,
# which CI keeps for one day, so it cannot be a pull request check: one run says nothing, it takes the runs side by side
# (scripts/check-coverage-flips.mjs, docs/coverage/README.md, "Runs that reach different code").
#
# When it finds something it opens one issue, "Coverage: branches reached only on some runs", or updates the one that is open
# with the current list, and fails the run so the schedule shows red until the tests are fixed.
name: Coverage flips

on:
  schedule:
  # Every day, 18:17 UTC (05:17 Sydney, AEDT), after the night's runs and inside the day CI keeps their coverage.
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-flips
  cancel-in-progress: false

jobs:
  flips:
    name: Branches reached only on some runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      # The newest ci.yml runs that still hold both server coverage artifacts, one after another (the request limit is shared).
      - name: Download the recent runs' server coverage
        run: node scripts/fetch-coverage-runs.mjs coverage-runs

      # Only flips in the server code that is on main now count: older code has changed since, so a flip in it is fixed or gone.
      # The check prints those for information. Exit 0: nothing flips in the current code. Exit 1: something does, and flips.txt
      # says what. Anything else is the check itself failing.
      - name: Compare the runs
        id: compare
        run: |
          set +e
          git fetch --no-tags --depth=1 origin main
          tree=$(git rev-parse FETCH_HEAD:apps/server) || exit 1
          node scripts/check-coverage-flips.mjs coverage-runs --current-tree "$tree" > flips.txt
          code=$?
          cat flips.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the issue
        if: steps.compare.outputs.code == '1'
        env:
          TITLE: "Coverage: branches reached only on some runs"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Found by the daily check of the last day's CI runs ([this run]($RUN_URL)). Each place below is reached by the tests in some runs and not in others, so the coverage check can turn red with no change to the code."
            echo
            echo '```text'
            cat flips.txt
            echo '```'
          } > body.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
            echo "Updated issue #$number."
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Fail when places flip or the check broke
        if: steps.compare.outputs.code != '0'
        env:
          CODE: ${{ steps.compare.outputs.code }}
        run: |
          echo "::error::The coverage flip check found places reached only on some runs, or could not run (exit code $CODE). See the list above."
          exit 1
