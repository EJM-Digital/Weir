<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Weir">
  <!-- Geometry traced from packaging/brand/source.png. These paths are the source:
       keep the copies in packaging/brand, apps/web and docs-site identical. -->
  <!-- App icon: the mark on the dark surface, so it reads on any tab bar,
       taskbar or tray. Source of every favicon and Windows icon 24px and
       above (see weir-app-icon-small.svg for 16px).
       The accent border sits inside the tile, with a margin of tile between it and
       the edge, as Deluno's icon does: centred 76/1024 of the tile in from the edge,
       20/1024 thick, corner radius 192/1024, at 38% opacity. The mark is drawn at
       0.8 so it clears the border by the same share of the tile. -->
  <rect width="24" height="24" rx="5.25" fill="#0b1418"/>
  <rect x="1.78" y="1.78" width="20.44" height="20.44" rx="4.5" fill="none" stroke="#3ed7c8" stroke-opacity="0.38" stroke-width="0.47"/>
  <g transform="translate(12 12) scale(0.8) translate(-12 -12)">
    <path d="M3.65 16.55L3.65 13.7A9.65 9.65 0 0 1 21.889 9.3L19.74 9.3A7.8 7.8 0 0 0 5.5 13.7L5.5 16.55Z" fill="#3ed7c8"/>
    <path d="M7.05 16.55L7.05 13.7A6.25 6.25 0 0 1 17.739 9.3L13.3 9.3A4.4 4.4 0 0 0 8.9 13.7L8.9 16.55Z" fill="#3ed7c8"/>
    <path d="M10.45 13.7L10.45 18.1L2.1 18.1L2.1 19.95L12.3 19.95L12.3 13.7A1 1 0 0 1 13.3 12.7L21.889 12.7L21.889 10.85L13.3 10.85A2.85 2.85 0 0 0 10.45 13.7Z" fill="#3ed7c8"/>
  </g>
</svg>
